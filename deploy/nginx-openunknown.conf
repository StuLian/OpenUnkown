# OpenUnknown Nginx 站点配置（子域名方案）
# 应用放在子域名 chat.your-domain.com，主域名首页仍由 OSS 服务。
# 替换 your-domain.com 为真实域名后放入 /etc/nginx/conf.d/openunknown.conf（dnf 系）
# 或 /etc/nginx/sites-available/openunknown（apt 系）。

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chat.your-domain.com;
    return 301 https://$host$request_uri;
}

# HTTPS 主站点
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.your-domain.com;

    ssl_certificate     /etc/nginx/ssl/chat_fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/chat_privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    # 应用直接放根路径（无需 /chat 前缀）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # 关键：SSE 流式必须关缓冲
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
